name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC (한국시간 오전 9시)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            'https://txhofwkopjsjtjimwxgz.supabase.co/rest/v1/companies?select=id&limit=1' \
            -H 'apikey: ${{ secrets.SUPABASE_ANON_KEY }}' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}')
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Keep-alive ping failed with status $response"
            exit 1
          fi
          echo "Supabase keep-alive OK"
